spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 27000000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jwt:
    secret: ${JWT_SECRET}

  data:
    redis:
      host: redis
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

springdoc:
  use-fqn: true

coolsms:
  api-key: ${COOLSMS_API_KEY}
  api-secret: ${COOLSMS_API_SECRET}
  sender-number: ${COOLSMS_SENDER_NUMBER}

ncp:
  storage:
    bucket-name: ${BUCKET_NAME}
    region: kr-standard
    endpoint: https://kr.object.ncloudstorage.com
    accessKey: ${NCP_OS_ACCESS_KEY}
    secretKey: ${NCP_OS_SECRET_KEY}

mail:
  provider: ${MAIL_PROVIDER:smtp}
  from-email: ${MAIL_FROM_EMAIL:${MAIL_USERNAME}}
  from-name: ${MAIL_FROM_NAME:WITHUS}
  sendgrid-api-key: ${SENDGRID_API_KEY:}
  sendgrid-endpoint: ${SENDGRID_ENDPOINT:https://api.sendgrid.com/v3/mail/send}
  sendgrid-event-webhook-public-key: ${SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY:}
  domain: ${SERVER_DOMAIN}
  logo-url: ${MAIL_LOGO_URL}
  interviewer-availability-url: ${MAIL_INTERVIEWER_AVAILABILITY_URL}
  evaluation-reminder-url: ${MAIL_EVALUATION_REMINDER_URL}
  invite-user-url: ${MAIL_INVITE_USER_URL}
  invitation-api-path: ${MAIL_INVITATION_API_PATH}
