name: Staging Deployment Workflow

on:
  pull_request:
    branches: [ "staging" ]

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML_ARGO }}" > ./src/main/resources/application-prod.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build --info --stacktrace --no-daemon

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/withus:${{ env.IMAGE_TAG }} .

      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/withus:${{ env.IMAGE_TAG }}

      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: 'WITHUS-K/MANIFEST' # 매니페스트 리포지토리 이름으로 변경
          token: ${{ secrets.PAT }}       # 또는 개인 액세스 토큰 사용
          path: 'manifest'                # clone할 경로 지정

      - name: Update deployment.yml
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          # 새 이미지 태그로 deployment.yml 업데이트
          sed -i "s|image:.*|image: ${DOCKERHUB_USERNAME}/withus:${IMAGE_TAG}|g" manifest/staging/deployment.yml
          
          # 변경사항 확인
          echo "Updated deployment.yml:"
          cat manifest/staging/deployment.yml

      # 6. 변경사항 커밋 및 푸시
      - name: Commit and push changes
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          cd manifest
          git config --local user.email "kjeng7897@gmail.com"
          git config --local user.name "SeongHo5356"
          git add staging/deployment.yml
          git commit -m "Update image tag to $IMAGE_TAG" || exit 0
          git push
